# archis.skylanex.com — the Archis name engine (/var/www/archis/dist)
#
# Deployed to /etc/nginx/conf.d/archis.skylanex.com.conf. Edit it here, copy it
# there, `nginx -t`, then `nginx -s reload` (`systemctl reload nginx` can fail
# 226/NAMESPACE on this box).
#
# ---------------------------------------------------------------------------
# Deploying an update
#
#     cd /var/www/archis && git pull
#     sudo systemctl restart archis     # rebuilds dist/ — see archis.service
#
# `dist/` is gitignored, so a pull alone changes nothing a visitor can see.
# Node 22 and npm 10 are already installed on the host.
# ---------------------------------------------------------------------------
#
# TLS: certificate issued for the bare subdomain through the shared webroot,
# the same way ui.skylanex.com and skylanex.com are set up:
#
#     certbot certonly --webroot -w /var/www/certbot -d archis.skylanex.com
#
# No www variant: www.archis.skylanex.com has no DNS record and no wildcard
# covers it, so adding it to -d would fail validation and take the whole
# certificate request down with it.

server {
    listen 80;
    listen [::]:80;
    server_name archis.skylanex.com;

    # `^~` is load-bearing. nginx matches regex locations before plain prefix
    # ones, so the dotfile-deny block below would otherwise claim this path and
    # renewals would 403.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://archis.skylanex.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name archis.skylanex.com;

    ssl_certificate /etc/letsencrypt/live/archis.skylanex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archis.skylanex.com/privkey.pem;

    root /var/www/archis/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Same policy as skylanex.com, and the fonts are the reason for the two
    # exceptions: the page loads Fraunces, Inter and JetBrains Mono from Google,
    # which needs the stylesheet host under style-src and the file host under
    # font-src. Everything else is this origin. The engine makes names in the
    # browser and calls nothing, so connect-src stays 'self'.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; media-src 'self'; connect-src 'self'" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Cache-Control comes from `expires` in both blocks below, never add_header:
    # a location that declares an add_header of its own drops every inherited
    # one, which would strip the security headers above from exactly the two
    # locations that serve the site.
    #
    # Vite fingerprints every file under /assets, so the name changes whenever
    # the bytes do and a year is safe.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else — index.html above all — keeps its name across deploys, so
    # it has to be revalidated or a returning visitor runs last week's bundle.
    # `expires -1` is Cache-Control: no-cache, which means "ask first", not
    # "never store".
    location / {
        expires -1;
        # One page, but the fallback costs nothing and means a typed path or a
        # future route answers with the app instead of nginx's 404.
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
